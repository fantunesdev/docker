x-app-runtime: &app-runtime
  restart: unless-stopped
  image: myfinance-app-myfin
  volumes:
    - ./static:/myfinance/static
    - ./myfinance/statement/migrations:/myfinance/migrations
    - ./myfinance/media/:/myfinance/media/
    - ./myfinance/logs/:/myfinance/logs/
  environment: &myfinance-environment
    DEBUG: "${MYFIN_DEBUG}"
    DJANGO: "${MYFIN_DEBUG}"
    SECRET_KEY: "${MYFIN_SECRET_KEY}"
    HOSTS: "${MYFIN_DJANGO_HOSTS}"
    CORS_ALLOWED_ORIGINS: "${MYFIN_CORS_ALLOWED_ORIGINS}"
    CSRF_TRUSTED_ORIGINS: "${MYFIN_CSRF_TRUSTED_ORIGINS}"
    TRUST_HTTPS_PROXY: "${MYFIN_TRUST_HTTPS_PROXY:-false}"
    SESSION_COOKIE_SECURE: "${MYFIN_SESSION_COOKIE_SECURE:-false}"
    CSRF_COOKIE_SECURE: "${MYFIN_CSRF_COOKIE_SECURE:-false}"
    SOCIAL_LOGIN_ENABLED: "${SOCIAL_LOGIN_ENABLED:-false}"
    GOOGLE_OAUTH2_KEY: "${GOOGLE_OAUTH2_KEY:-}"
    GOOGLE_OAUTH2_SECRET: "${GOOGLE_OAUTH2_SECRET:-}"
    PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
    CACHE_URL: "${CACHE_URL:-redis://redis-myfin:6379/1}"
    EMAIL_BACKEND: "${EMAIL_BACKEND:-login.email_backend.GmailBackend}"
    GMAIL_CLIENT_ID: "${GMAIL_CLIENT_ID:-}"
    GMAIL_CLIENT_SECRET: "${GMAIL_CLIENT_SECRET:-}"
    GMAIL_REFRESH_TOKEN: "${GMAIL_REFRESH_TOKEN:-}"
    GMAIL_REFRESH_TOKEN_FILE: "${GMAIL_REFRESH_TOKEN_FILE:-}"
    GMAIL_SENDER_EMAIL: "${GMAIL_SENDER_EMAIL:-}"
    TWO_FACTOR_ENCRYPTION_KEY: "${TWO_FACTOR_ENCRYPTION_KEY:-}"
    DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-${GMAIL_SENDER_EMAIL:-}}"
    EMAIL_TIMEOUT: "${EMAIL_TIMEOUT:-15}"
    PASSWORD_RESET_TIMEOUT: "${PASSWORD_RESET_TIMEOUT:-1800}"
    PASSWORD_RESET_RATE_WINDOW: "${PASSWORD_RESET_RATE_WINDOW:-900}"
    PASSWORD_RESET_IP_LIMIT: "${PASSWORD_RESET_IP_LIMIT:-30}"
    PASSWORD_RESET_EMAIL_LIMIT: "${PASSWORD_RESET_EMAIL_LIMIT:-3}"
    MYSQL_USER: "${MYFIN_MYSQL_USER}"
    MYSQL_PASSWORD: "${MYFIN_MYSQL_PASSWORD}"
    MYSQL_DATABASE: "${MYFIN_MYSQL_DATABASE}"
    MYSQL_HOST: "${MYFIN_MYSQL_HOST}"
    MYSQL_PORT: "${MYFIN_MYSQL_PORT}"
    URL: "VAULT_URL"
    ACCESS_TOKEN_EXPIRE_MINUTES: "${MYFIN_DJANGO_ACCESS_TOKEN_EXPIRE_MINUTES}"
    ALGORITHM: "${MYFIN_DJANGO_ALGORITHM}"
    TRANSACTION_CLASSIFIER_URL: "${MYFIN_TRANSACTION_CLASSIFIER_URL}"
    TRANSACTION_CLASSIFIER_PORT: "${MYFIN_TRANSACTION_CLASSIFIER_PORT}"
    PLUGGY_CLIENT_ID: "${PLUGGY_CLIENT_ID:-}"
    PLUGGY_CLIENT_SECRET: "${PLUGGY_CLIENT_SECRET:-}"
    PLUGGY_ITEM_ID: "${PLUGGY_ITEM_ID:-}"
  depends_on:
    - mysql-myfin
    - redis-myfin

  command: >
    sh -c "
      python manage.py collectstatic --no-input --verbosity 0 &&
      daphne -b 0.0.0.0 -p 8000 myfinance.asgi:application
    "

services:
  app-myfin:
    <<: *app-runtime
    profiles: [legacy]
    container_name: app-myfin
    build:
      context: .
    networks:
      myfin-net:
        ipv4_address: 172.18.0.3

  app-myfin-blue:
    <<: *app-runtime
    profiles: [blue]
    container_name: app-myfin-blue
    volumes:
      - ./.mfdeploy/assets/blue/static:/myfinance/static
      - ./myfinance/statement/migrations:/myfinance/migrations
      - ./myfinance/media/:/myfinance/media/
      - ./myfinance/logs/:/myfinance/logs/
    networks:
      myfin-net:
        ipv4_address: 172.18.0.8

  app-myfin-green:
    <<: *app-runtime
    profiles: [green]
    container_name: app-myfin-green
    volumes:
      - ./.mfdeploy/assets/green/static:/myfinance/static
      - ./myfinance/statement/migrations:/myfinance/migrations
      - ./myfinance/media/:/myfinance/media/
      - ./myfinance/logs/:/myfinance/logs/
    networks:
      myfin-net:
        ipv4_address: 172.18.0.9

  investment-history:
    container_name: myfinance-investment-history
    image: myfinance-app-myfin
    restart: unless-stopped
    command: ["python", "manage.py", "process_investment_history"]
    environment: *myfinance-environment
    volumes:
      - ./myfinance/logs/:/myfinance/logs/
    depends_on:
      - mysql-myfin
      - redis-myfin
    networks:
      myfin-net:
        ipv4_address: 172.18.0.7

  password-reset-email:
    container_name: myfinance-password-reset-email
    image: myfinance-app-myfin
    restart: unless-stopped
    command: ["python", "manage.py", "process_password_reset_emails"]
    environment: *myfinance-environment
    volumes:
      - ./myfinance/logs/:/myfinance/logs/
    depends_on:
      - mysql-myfin
      - redis-myfin
    networks:
      myfin-net:
        ipv4_address: 172.18.0.10

  mysql-myfin:
    container_name: mysql-myfin
    restart: unless-stopped
    image: mysql:9.7.4.1
    environment:
      MYSQL_ROOT_PASSWORD: "${MYFIN_MYSQL_ROOT_PASSWORD}"
      MYSQL_USER: "${MYFIN_MYSQL_USER}"
      MYSQL_PASSWORD: "${MYFIN_MYSQL_PASSWORD}"
      MYSQL_DATABASE: "${MYFIN_MYSQL_DATABASE}"
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-myfin-vol:/var/lib/mysql
    networks:
      myfin-net:
        ipv4_address: 172.18.0.2

  nginx-myfin:
    container_name: nginx-myfin
    restart: unless-stopped
    image: nginx:1.19.0-alpine
    volumes:
      - ./static/:/static/
      - ./myfinance/media/:/media/
      - ./nginx:/etc/nginx/conf.d:ro
      - ./.mfdeploy/assets:/deploy-assets:ro
    ports:
      - "127.0.0.1:81:80"
    depends_on:
      - mysql-myfin
      - redis-myfin
    networks:
      myfin-net:
        ipv4_address: 172.18.0.5
        aliases: [app-myfin]
      https-proxy: {}

  redis-myfin:
    container_name: redis-myfin
    image: redis:alpine
    restart: always
    networks:
      myfin-net:
        ipv4_address: 172.18.0.4

  transaction-classifier:
    container_name: transaction-classifier
    build:
      context: ./transaction_classifier
    ports:
      - "127.0.0.1:8112:8112"
    environment:
      SECRET_KEY: "${MYFIN_SECRET_KEY}"
      ALGORITHM: "${TRANSACTION_CLASSIFIER_ALGORITHM}"
      TOKEN_URL: "${TRANSACTION_CLASSIFIER_TOKEN_URL}"
      SERVER_URL: "${TRANSACTION_CLASSIFIER_SERVER_URL}"
      URL: "${TRANSACTION_CLASSIFIER_URL}"

      REDIS_HOST: "${TRANSACTION_CLASSIFIER_REDIS_HOST}"
      REDIS_PORT: "${TRANSACTION_CLASSIFIER_REDIS_PORT}"
      REDIS_DB: "${TRANSACTION_CLASSIFIER_REDIS_DB}"
      REDIS_KEY: "${TRANSACTION_CLASSIFIER_REDIS_KEY}"
      OAUTH2_TOKEN_URL: "${TRANSACTION_CLASSIFIER_OAUTH2_TOKEN_URL}"
      CLIENT_ID: "${TRANSACTION_CLASSIFIER_CLIENT_ID}"
      CLIENT_SECRET: "${TRANSACTION_CLASSIFIER_CLIENT_SECRET}"
    volumes:
      - ./transaction_classifier:/app
    depends_on:
      - mysql-myfin
      - redis-myfin
    networks:
      myfin-net:
        ipv4_address: 172.18.0.6
    restart: unless-stopped

networks:
  https-proxy:
    external: true
    name: myfinance-proxy
  myfin-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.18.0.0/16

volumes:
  mysql-myfin-vol:
