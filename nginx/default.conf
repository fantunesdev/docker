# The outer proxy and VM loopback are the only published entry points.
map $http_x_forwarded_proto $original_scheme {
    default http;
    https https;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream django.myfinance.com {
    server app-myfin:8000;
}

server {
    listen 80;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $original_scheme;

    location / {
        proxy_pass http://django.myfinance.com;
    }

    location /static {
        alias /static;
    }

    location /ws/ {
        proxy_pass http://django.myfinance.com;
        proxy_http_version 1.1;
        # Defining Upgrade here requires repeating the other proxy headers.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $original_scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
